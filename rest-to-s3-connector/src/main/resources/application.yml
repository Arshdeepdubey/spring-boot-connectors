server:
  port: 8081

spring:
  application:
    name: rest-to-s3-connector

connector:
  http:
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    max-retries: 2
    retry-backoff-ms: 500

  source:
    rest:
      url: ${SOURCE_API_URL:http://localhost:8089/api/orders}
      method: ${SOURCE_API_METHOD:GET}
      headers:
        Accept: application/json
      auth:
        type: ${SOURCE_API_AUTH_TYPE:NONE}
        api-key-header: ${SOURCE_API_KEY_HEADER:X-API-Key}
        api-key-value: ${SOURCE_API_KEY_VALUE:}
        bearer-token: ${SOURCE_API_BEARER_TOKEN:}
        username: ${SOURCE_API_USERNAME:}
        password: ${SOURCE_API_PASSWORD:}

  target:
    s3:
      bucket: ${TARGET_S3_BUCKET:connector-orders-bucket}
      key-prefix: ${TARGET_S3_KEY_PREFIX:orders/}
      file-format: ${TARGET_S3_FILE_FORMAT:CSV}

  aws:
    s3:
      region: ${AWS_REGION:us-east-1}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      endpoint-override: ${AWS_S3_ENDPOINT_OVERRIDE:}
      path-style-access-enabled: ${AWS_S3_PATH_STYLE_ACCESS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.example.connectors: DEBUG
